<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vulnerability Scanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="header__brand">
          <span class="header__logo" aria-hidden="true">🛡️</span>
          <div>
            <h1>Vulnerability Scanner</h1>
            <p class="subtitle">Scan any website for security headers, open ports, and SSL/TLS issues.</p>
          </div>
        </div>
      </header>

      <main class="main">
        <section class="panel">
          <h2 class="panel__title">Scan configuration</h2>
          <form class="form" id="scanForm" method="post" action="/scan" novalidate>
            <div class="field">
              <label for="url">Target URL</label>
              <input id="url" name="url" required type="url" placeholder="https://example.com" value="{{ url or '' }}" />
              <div class="hint">Include the scheme (http:// or https://).</div>
            </div>

            <div class="field">
              <label for="host">Optional host override</label>
              <input id="host" name="host" type="text" placeholder="example.com" value="{{ host or '' }}" />
              <div class="hint">If left blank, the host is inferred from the URL.</div>
            </div>

            <div class="field">
              <label for="keywords">Custom keyword scan</label>
              <div class="keyword-presets">
                <select id="keywordPreset" class="preset">
                  <option value="">Select preset...</option>
                  <option value="password,token,api_key">Common secrets</option>
                  <option value="aws_access_key,aws_secret_access_key,access_key">AWS keys</option>
                  <option value="ssh-rsa,ssh-dss,private_key">SSH / Key material</option>
                </select>
                <button type="button" class="btn btn--secondary" id="addKeywordPreset">Add</button>
              </div>
              <input id="keywords" name="keywords" type="text" placeholder="password, api_key, token" value="{{ keywords or '' }}" />
              <div class="hint">Comma-separated terms to search for in the response.</div>
            </div>

            <div class="checkbox">
              <input id="xss" name="xss" type="checkbox" {% if xss %}checked{% endif %} />
              <label for="xss">Include basic XSS form testing</label>
            </div>

            <div class="actions">
              <button type="submit" class="btn" id="submitBtn">Run Scan</button>
              <button type="button" class="btn btn--secondary" id="cancelBtn" hidden>Cancel</button>
              <span class="spinner" id="spinner" aria-hidden="true"></span>
              <span class="status" id="statusText" aria-live="polite"></span>
            </div>
          </form>
        </section>

      <section class="panel panel--results">
        <h2 class="panel__title">Results</h2>
        <pre class="output" aria-live="polite" id="output">{{ logs or '' }}</pre>
      </section>

    <script>
      const form = document.getElementById('scanForm');
      const button = document.getElementById('submitBtn');
      const cancel = document.getElementById('cancelBtn');
      const spinner = document.getElementById('spinner');
      const output = document.getElementById('output');
      const status = document.getElementById('statusText');
      const keywordInput = document.getElementById('keywords');
      const presetSelect = document.getElementById('keywordPreset');
      const addPresetBtn = document.getElementById('addKeywordPreset');

      function addPresetToInput() {
        const preset = presetSelect.value.trim();
        if (!preset) return;
        const existing = keywordInput.value.trim();
        const combined = existing ? `${existing}, ${preset}` : preset;
        keywordInput.value = combined;
        presetSelect.value = '';
        keywordInput.focus();
      }

      addPresetBtn.addEventListener('click', addPresetToInput);

      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function appendLine(text) {
        const line = document.createElement('span');
        line.classList.add('line');

        const trimmed = text.trimEnd();
        if (trimmed.startsWith('[ERROR]')) {
          line.classList.add('line--error');
        } else if (trimmed.startsWith('[WARN]')) {
          line.classList.add('line--warn');
        } else {
          line.classList.add('line--info');
        }

        line.innerHTML = escapeHtml(text);
        output.appendChild(line);
        output.appendChild(document.createElement('br'));
        output.scrollTop = output.scrollHeight;
      }

      async function streamScan(url, host, xss, controller, keywords) {
        const res = await fetch('/api/scan-stream', {
          method: 'POST',
          signal: controller.signal,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, host, xss, keywords }),
        });

        if (!res.ok) {
          const errorText = await res.text();
          throw new Error(errorText || 'Scan failed');
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split(/\n/);
          for (const line of lines) {
            if (!line) continue;
            appendLine(line);
          }
        }
      }

      function setRunning(running) {
        button.disabled = running;
        cancel.hidden = !running;
        status.textContent = running ? 'Scanning…' : '';
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const controller = new AbortController();

        setRunning(true);
        spinner.classList.add('spinner--active');
        output.textContent = '';

        const url = form.url.value.trim();
        const host = form.host.value.trim();
        const xss = form.xss.checked;
        const keywords = form.keywords.value.trim();

        cancel.addEventListener(
          'click',
          () => {
            controller.abort();
            appendLine('[ERROR] Scan canceled by user');
            setRunning(false);
            spinner.classList.remove('spinner--active');
          },
          { once: true }
        );

        try {
          await streamScan(url, host, xss, controller, keywords);
        } catch (err) {
          if (err.name === 'AbortError') {
            return;
          }
          appendLine(`[ERROR] ${err.message}`);
        } finally {
          setRunning(false);
          spinner.classList.remove('spinner--active');
        }
      });
    </script>
  </body>
</html>
