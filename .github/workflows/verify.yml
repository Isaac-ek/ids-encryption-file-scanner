name: Verify unified workspace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/pytest
      - run: npm ci --prefix frontend && npm run build --prefix frontend
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm run test:e2e --prefix frontend
      - run: docker build -t securestream-ci .
      - run: docker run --rm securestream-ci python -c "from api.ids_runtime import metadata; status = metadata(); assert status['available'], status; assert status['evaluation']['records'] == 22544"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-details
          path: frontend/test-results
