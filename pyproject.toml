[project]
name = "ids-encryption-file-scanner"
version = "0.1.0"
description = "Serverless deployment manifest for the IDS encryption file scanner"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.1",
  "Flask-Login==0.6.3",
  "Werkzeug==3.1.3",
  "flask-socketio==5.5.1",
  "pandas==2.3.0",
  "numpy==2.3.0",
  "scikit-learn==1.6.1",
  "joblib==1.5.1",
  "pyyaml==6.0.2",
  "cryptography==45.0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
py-modules = []
